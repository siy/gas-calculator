[package]
name = "gas-calculator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.44.2", features = ["full"] }
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
dotenv = "0.15.0"
hex = "0.4.3"
revm = { version = "3.5.0", features = ["optional_balance_check"] }
reqwest = { version = "0.12.15", features = ["json"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
thiserror = "2.0.12"
